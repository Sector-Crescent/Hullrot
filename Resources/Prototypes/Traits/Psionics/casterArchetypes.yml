- type: trait
  id: PsionicHunter
  category: Psionics
  points: -4
  functions:
    - !type:TraitAddComponent
      components:
        - type: Psionic
          baselinePowerCost: 2000
          nextPowerCost: 2000
        - type: Eye
          visMask:
            - PsionicInvisibility
            - Normal
            - Ethereal
    - !type:TraitAddPsionics
      psionicPowers:
        - PsychognomyPower
        - MetapsionicPower
        - AssayPower
        - DispelPower
  requirements:
    - !type:CharacterItemGroupRequirement
      group: TraitsCasterType
    - !type:CharacterJobRequirement
      inverted: true
      jobs:
        - Borg
        - MedicalBorg
        - Chaplain
        - Prisoner
    - !type:CharacterLogicOrRequirement
      requirements:
        - !type:CharacterSpeciesRequirement
          inverted: true
          species:
            - IPC
            - Oni

