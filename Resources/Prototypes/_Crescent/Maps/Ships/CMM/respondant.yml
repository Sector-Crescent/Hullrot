- type: vessel
  id: Respondant
  name: TS Respondant
  description: |
    LOADOUT: 2x 20mm 'Screamer' gatlings, 2x 60mm 'Azimuth' LMLs
    MINIMUM CREW: 1x Pilot, 1x Loader/Paramedic (Optional)
    A brawler and medevac combination. Will likely die to anything above its weight class, but may scare off smaller enemies.
  price: 51000
  category: Small
  group: None
  path: /Maps/_Crescent/Shuttles/CMM/respondant.yml

- type: gameMap
  id: Respondant
  mapName: 'Respondant'
  mapPath: /Maps/_Crescent/Shuttles/CMM/respondant.yml
  minPlayers: 0
  stations:
    Respondant:
      stationProto: StandardCrescentExpeditionVessel
      components:
        - type: VesselIcon
          iffIcon:
            sprite: _Crescent/ShipIcons/ifficons.rsi
            state: corvette
        - type: StationNameSetup
          mapNameTemplate: 'TS Respondant {1}'
          nameGenerator:
           !type:NanotrasenNameGenerator
            prefixCreator: '14'
        - type: VesselDesignation
          designation: vessel-designation-corvette
        - type: VesselDescription
          description: A compact brawler corvette, meant to save people from the claws of death with its small arnament and medical bay.
