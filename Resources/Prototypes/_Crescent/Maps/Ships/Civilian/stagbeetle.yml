- type: vessel
  id: Stagbeetle
  name: TS Stagbeetle
  description: |
    Equipped with 2 underpowered machineguns, this vessel is a cheap escort vessel for the cockroach's mining crew. Comes with stale air atmosphere to save oxygen.
    LOADOUT: 2x SHI 20x135mm PDT
    MINIMUM CREW: 1x Brave Soul
  price: 9000
  category: Small
  group: Scrap
  path: /Maps/_Crescent/Shuttles/Civilian/stagbeetle.yml

- type: gameMap
  id: Stagbeetle
  mapName: 'Stagbeetle'
  mapPath: /Maps/_Crescent/Shuttles/Civilian/stagbeetle.yml
  minPlayers: 0
  stations:
    Stagbeetle:
      stationProto: StandardCrescentExpeditionVessel
      components:
        - type: VesselIcon
          iffIcon:
            sprite: _Crescent/ShipIcons/ifficons.rsi
            state: fighter
        - type: StationNameSetup
          mapNameTemplate: 'Stagbeetle {1}'
          nameGenerator:
           !type:NanotrasenNameGenerator
            prefixCreator: '14'
        - type: VesselDesignation
          designation: vessel-designation-fighter
        - type: VesselDescription
          description: The Stagbeetle is often seen in last-ditch efforts by miners to defend it's mothership.
