    layers:
    - state: pack
  - type: ExtendDescription
    descriptionList:
      - description: Use to open.
        fontSize: 15
        color: "#ff4f00"
        requireDetailRange: false
  - type: SpawnItemsOnUse
    items:
      - id: GrandStarTicketPackUsed
      - id: GrandStarTicket
      - id: GrandStarTicket
      - id: GrandStarTicket
      - id: GrandStarTicket
      - id: GrandStarTicket
      - id: GrandStarTicket
      - id: GrandStarTicket
      - id: GrandStarTicket
      - id: GrandStarTicket
      - id: GrandStarTicket
    sound:
      path: /Audio/Effects/unwrap.ogg
  - type: StaticPrice # 10 in the price of 8 how nice!
    price: 8000

