- type: entity
  parent: BaseItem
  suffix: Lost
  id: GrandStarTicketlost
  name: Grand star scratch off ticket
  description: A grand star scratch off ticket, it says on the backside that the grand prize is 1,000,000 Taypani Yen. This one has already ben scratched.
  components:
  - type: Sprite
    sprite: _Crescent/Objects/Fun/Gambling/grand_star.rsi
    layers:
    - state: used
  - type: ExtendDescription
    descriptionList:
      - description: You have lost, better luck next time. This ticket can still be sold for 5 yen, how generous!
        fontSize: 15
        color: "#ff0015"
        requireDetailRange: false
  - type: StaticPrice
    price: 5

