- type: entity
  id: GrandStarTicket
  parent: BaseItem
  suffix: unused
  name: Grand star scratch off ticket
  description: A grand star scratch off ticket, it says on the backside that the grand prize is 1,000,000 Taypani Yen.
  components:
  - type: Sprite
    sprite: _Crescent/Objects/Fun/Gambling/grand_star.rsi
    layers:
    - state: base
  - type: ExtendDescription
    descriptionList:
      - description: Use to scratch off.
        fontSize: 15
        color: "#ff4f00"
        requireDetailRange: false
  - type: SpawnItemsOnUse
    items:
      - id: GrandStarTicketlost # its gambling you are ment to lose
        prob: 1000000
        orGroup: GrandTicketPool
      - id: GrandStarTicket50
        prob: 500000
        orGroup: GrandTicketPool
      - id: GrandStarTicket250
        prob: 500000
        orGroup: GrandTicketPool
      - id: GrandStarTicket500
        prob: 500000
        orGroup: GrandTicketPool
      - id: GrandStarTicket1k
        prob: 250000
        orGroup: GrandTicketPool
      - id: GrandStarTicket5k
        prob: 100000
        orGroup: GrandTicketPool
      - id: GrandStarTicket10k
        prob: 25000
        orGroup: GrandTicketPool
      - id: GrandStarTicket50k
        prob: 5000
        orGroup: GrandTicketPool
      - id: GrandStarTicket100k
        prob: 500
        orGroup: GrandTicketPool
      - id: GrandStarTicket250k
        prob: 100
        orGroup: GrandTicketPool
      - id: GrandStarTicket1mil # pretty sure this is 1 in 100000 odds
        prob: 1
        orGroup: GrandTicketPool
    sound:
      path: /Audio/Effects/unwrap.ogg
  - type: StaticPrice
    price: 1000 # you will NOT win, you WILL lose money

- type: entity
  id: GrandStarTicketPack
  parent: BaseItem
  suffix: unused
  name: Grand star scratch off ticket 10-pack
  description: A grand star scratch off ticket 10-pack. Pay less win more!
