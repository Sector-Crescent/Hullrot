- type: entity
  name: CDT C-12R Tuber 12g
  parent: [BaseWeaponShotgun, BaseGunWieldable]
  id: WeaponShotgunTuber
  description: Top of the line pump shotgun with 2 ammo tubes allowing for a massive 12 shell capacity and can even be slam fired, although this system makes the shotgun very bulky. Made by Cyberdawn for Cyberdawn.
  components:
  - type: Sprite
    sprite: _Crescent/Objects/Weapons/Guns/tuber.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-1
        map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: _Crescent/Objects/Weapons/Guns/tuber.rsi
  - type: Gun
    selectedMode: FullAuto
    availableModes:
    - FullAuto
  - type: Item
    size: Huge
    shape:
    - 0,0,4,2
    sprite: _Crescent/Objects/Weapons/Guns/tuber.rsi
  - type: BallisticAmmoProvider
    capacity: 12
    autoCycle: false
  - type: MagazineVisuals
    magState: mag
    steps: 5
    zeroVisible: false
  - type: Wieldable
  - type: GunRequiresWield
  - type: MeleeWeapon
    attackRate: 1.4
    damage:
      types:
        Blunt: 9
  - type: DamageOtherOnHit
    staminaCost: 8.0

- type: entity
  name: CDT C-60 Underdog 5.56x45mm
  parent: BaseWeaponRifle
  id: WeaponRifleUnderdog
  description: A rifle with a integrated 30mm under barrel grenade launcher, capable of firing VOG-30 grenades. Made by Cyberdawn for Cyberdawn.
  components:
  - type: Item
    shape:
    - 0,0,4,1
  - type: Sprite
    sprite: _Crescent/Objects/Weapons/Guns/underdog.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-0
        map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: _Crescent/Objects/Weapons/Guns/underdog.rsi
  - type: Gun
    fireRate: 5
    soundGunshot:
      path: /Audio/_Crescent/Weapons/Guns/rifle_2/rifle_gunshot_2.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazineLightRifle
        insertSound: /Audio/Weapons/Guns/MagIn/ltrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/ltrifle_magout.ogg
        priority: 2
        whitelist:
          tags:
            - MagazineLightRifle
      gun_chamber:
        name: Chamber
        startingItem: CartridgeLightRifle
        priority: 1
        whitelist:
          tags:
            - CartridgeLightRifle
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: Appearance
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: StaticPrice
    price: 1000

