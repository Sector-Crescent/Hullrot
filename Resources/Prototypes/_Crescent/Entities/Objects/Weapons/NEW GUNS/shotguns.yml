- type: entity
  name: SHI SH-90-S
  parent: [BaseWeaponSubMachineGun, StreeCredRedeemable ]
  id: WeaponShotgunSH90S
  description: placeholder
  components:
  - type: Sprite
    sprite: _Crescent/Objects/Weapons/Guns/New_Guns/SHOTGUN/SH-90-S.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-0
        map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: _Crescent/Objects/Weapons/Guns/New_Guns/SHOTGUN/SH-90-S.rsi
    slots:
    - Back
    - suitStorage
  - type: ChamberMagazineAmmoProvider
    boltClosed: null
  - type: Gun
    soundGunshot:
      path: /Audio/_Crescent/Weapons/Guns/shotgun_1/shotgun_gunshot_3.ogg
    soundEmpty:
      path: /Audio/Weapons/Guns/Empty/empty.ogg
    fireRate: 2
    angleIncrease: 5
    angleDecay: 10
    maxAngle: 10
    minAngle: 1
    selectedMode: FullAuto
    availableModes:
    - SemiAuto
    - FullAuto
    fireOnDropChance: 0.1
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: CrescentMagazine_12Ga
        insertSound: /Audio/Weapons/Guns/MagIn/smg_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/smg_magout.ogg
        priority: 2
        whitelist:
          tags:
            - CrescentMagazine_12Ga
      gun_chamber:
        name: Chamber
        startingItem: CrescentCartridge_12Ga
        priority: 1
        whitelist:
          tags:
            - CrescentCartridge_12Ga
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance

