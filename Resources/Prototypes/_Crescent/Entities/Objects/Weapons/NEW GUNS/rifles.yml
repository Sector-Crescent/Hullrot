- type: entity
  parent: [BaseWeaponSniper, BaseGunWieldable, StreeCredRedeemable]
  id: WeaponRifleSHIM919
  name: SHI-UA M919 5.56x45
  description: An incredibly cheap "replica" lever action rifle, produced by the Shinohara subsidiary, United Arms. Yeah the action is tough, and yeah the polymer feels like shit, but it fires bullets doesn't it?
  components:
  - type: Item
    size: Ginormous
  - type: StaticPrice
    price: 2000
  - type: Sprite
    sprite: _Crescent/Objects/Weapons/Guns/New_Guns/RIFLE/M919
  - type: Clothing
    sprite: _Crescent/Objects/Weapons/Guns/New_Guns/RIFLE/M919
  - type: Gun
    fireRate: 3
    projectileSpeed: 45
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/UnionfallWeapons/lever_fire.ogg
  - type: BallisticAmmoProvider
