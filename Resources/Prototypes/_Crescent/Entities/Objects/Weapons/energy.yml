#Lasguns

#Lasrifle
- type: entity
  name: SHI 90c 'Taiyo' Laser Rifle
  id: SHIlasgunrifle
  description: SHI 90c 'Taiyo' Laser Rifle is Shinohara's most generic, reliable, and best selling energy rifle on the market. Able to slot in any power cell to use as it's ammunition.
  parent: BaseItem
  components:
  - type: Sprite
    sprite: _Crescent/Objects/Weapons/Guns/lasgun_generic.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-unshaded-4
      map: ["enum.GunVisualLayers.MagUnshaded"]
      shader: unshaded
  - type: MagazineVisuals
    magState: mag
    steps: 5
    zeroVisible: true
  - type: Clothing
    sprite: _Crescent/Objects/Weapons/Guns/lasgun_generic.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: Item
    size: Huge
    shape:
    - 0,0,4,1
  - type: AmmoCounter
  - type: Gun
    projectileSpeed: 35 #it go pew pew
    fireRate: 5
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/laser_cannon.ogg
  - type: MagazineAmmoProvider
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: lasgunriflepowercell
        insertSound: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/batrifle_magout.ogg
        whitelist:
          tags:
            - PowerCell
            - PowerCellSmall
            - EnergygunCell
            - DisablerEnergyCell
  - type: Appearance
  - type: StaticPrice
    price: 500
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
  - type: MeleeWeapon
    attackRate: 2
    damage:
      types:
        Blunt: 9.0
    bluntStaminaDamageFactor: 1.25
    swapKeys: true
    disableHeavy: true
    animation: WeaponArcThrust
    wideAnimationRotation: 90
    soundHit:
      collection: MetalThud
  - type: IncreaseDamageOnWield
    damage:
      types:
        Blunt: 10
  - type: DamageOtherOnHit
    staminaCost: 10
    zeroVisible: true
  - type: Wieldable
  - type: GunRequiresWield
  # Shitmed Change
  - type: Cautery
    speed: 0.9
  - type: SurgeryTool
    endSound:
      path: /Audio/Weapons/Guns/Gunshots/laser.ogg

#Laspistol
- type: entity
  name: SHI 60c 'Hoshi' Laser Pistol
  id: SHIlasgunpistol
  description: SHI 60c 'Hoshi' Laser Pistol is Shinohara's most generic, reliable, and best selling energy pistol on the market. Able to slot in any power cell to use as it's ammunition. Unable to use Las-rifle power cells.
  parent: BaseItem
  components:
  - type: Sprite
    sprite: _Crescent/Objects/Weapons/Guns/lasgun_generic_pistol.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-unshaded-4
      map: ["enum.GunVisualLayers.MagUnshaded"]
      shader: unshaded
  - type: MagazineVisuals
    magState: mag
    steps: 5
    zeroVisible: true
  - type: Clothing
    sprite: Objects/Weapons/Guns/Battery/taser.rsi
    quickEquip: false
    slots:
    - suitStorage
    - Belt
  - type: Item
    size: Small
    shape:
    - 0,0,1,0
    - 0,1,0,1
  - type: AmmoCounter
  - type: Gun
    projectileSpeed: 35 #it go pew pew
    fireRate: 3 #slower then the regular las rifle
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/laser_cannon.ogg
  - type: MagazineAmmoProvider
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: lasgunpistolpowercell
        insertSound: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/batrifle_magout.ogg
        whitelist:
          tags:
            - PowerCell
            - PowerCellSmall
            - PistolEnergygunCell
            - DisablerEnergyCell
        blacklist:
          tags:
            - EnergygunCell
  - type: Appearance
  - type: StaticPrice
    price: 500
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
  - type: MeleeWeapon
    attackRate: 2
    damage:
      types:
        Blunt: 9.0
    bluntStaminaDamageFactor: 1.25
    swapKeys: true
    disableHeavy: true
    animation: WeaponArcThrust
    wideAnimationRotation: 180
    soundHit:
      collection: MetalThud
  - type: DamageOtherOnHit
    staminaCost: 10
    zeroVisible: true
  # Shitmed Change
  - type: Cautery
    speed: 0.9
  - type: SurgeryTool
    endSound:
      path: /Audio/Weapons/Guns/Gunshots/laser.ogg
