#the projectile used for hullrot lasguns, i pray this one works
- type: entity
  id: InfantryLasboltMedium
  name: las bolt
  parent: BaseBullet
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Heat: 26
        Structural: 20
    harmorPenetration: 15
    stoppingPower: 1
    color: "#ff0101"
  - type: Fixtures
    fixtures:
      projectile:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.15,-0.3,0.15,0.3"
        hard: false
        mask:
        - Opaque # WWDP allow shooting through windows
  - type: Reflective
    reflective:
    - Energy
  - type: FlyBySound
    sound:
      collection: EnergyMiss
      params:
        volume: 5
  - type: PointLight
    radius: 3
    color: "#ff0101"
    energy: 1
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/projectiles.rsi #_Crescent/Objects/Weapons/Projectiles/plasma.rsi
    layers:
      - state: beam #icon
    color: "#ff0101"
    rotation: 90
  - type: ProjectilePhasePrevent

- type: entity
  id: InfantryLasboltPistol
  name: pistol las bolt
  parent: BaseBullet
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Heat: 15
        Structural: 20
    harmorPenetration: 15
    stoppingPower: 1
    color: "#07ff13"
  - type: Fixtures
    fixtures:
      projectile:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.15,-0.3,0.15,0.3"
        hard: false
        mask:
        - Opaque # WWDP allow shooting through windows
  - type: Reflective
    reflective:
    - Energy
  - type: FlyBySound
    sound:
      collection: EnergyMiss
      params:
        volume: 5
  - type: PointLight
    radius: 3
    color: "#07ff13"
    energy: 1
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/projectiles.rsi
    layers:
      - state: beam #icon
    color: "#07ff13"
    rotation: 90
  - type: ProjectilePhasePrevent

- type: entity
  name : hullrot disabler bolt
  id: HullrotBulletDisabler
  parent: BaseBullet
  categories: [ HideSpawnMenu ]
  components:
  - type: Reflective
    reflective:
    - Energy
  - type: FlyBySound
    sound:
      collection: EnergyMiss
      params:
        volume: 5
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/projectiles_tg.rsi
    layers:
    - state: omnilaser
      shader: unshaded
  - type: Physics
  - type: Fixtures
    fixtures:
      projectile:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.15,-0.3,0.15,0.3"
        hard: false
        mask:
        - Opaque # WWDP allow shooting through windows
  - type: Ammo
  - type: StaminaDamageOnCollide
    damage: 20
  - type: Projectile
    impactEffect: BulletImpactEffectDisabler
    damage:
      types:
        Shock: 1 #can't remove this because it just makes it deal blunt... which is fucked
    soundHit:
      collection: WeakHit
    forceSound: true

