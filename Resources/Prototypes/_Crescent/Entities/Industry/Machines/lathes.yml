#ore

- type: entity
  parent: BaseLatheLube
  id: OreProcessor
  name: ore processor
  description: It produces sheets and ingots using ores.
  components:
  - type: Sprite
    sprite: Structures/Machines/ore_processor.rsi
    layers:
    - state: icon
      map: ["enum.LatheVisualLayers.IsRunning"]
    - state: unlit
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
    - state: inserting
      map: ["enum.MaterialStorageVisualLayers.Inserting"]
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: Machine
    board: OreProcessorMachineCircuitboard
  - type: Lathe
    idleState: icon
    runningState: building
    defaultProductionAmount: 10
    staticRecipes:
      - SheetSteel1
      - IngotCopper1
      - SheetGlass1
      - SheetPlasma1
      - SheetUranium1
      - IngotGold1
      - IngotSilver1
      - IngotTungsten1
  - type: MaterialStorageMagnetPickup
    magnetEnabled: True
    range: 0.5

- type: entity
  parent: OreProcessor
  id: OreProcessorIndustrial
  name: industrial ore processor
  description: An ore processor specifically designed for mass-producing metals in industrial applications.
  components:
  - type: Sprite
    sprite: Structures/Machines/ore_processor_industrial.rsi
  - type: Machine
    board: OreProcessorIndustrialMachineCircuitboard
  - type: Lathe
    materialUseMultiplier: 0.75
    timeMultiplier: 0.5

#scrap

- type: entity
  parent: BaseLatheLube
  id: ScrapRefiner
  name: SHI scrap upcycler
  description: An automated refinery with scrap metal refinement patterns.
  components:
  - type: Sprite
    sprite: Structures/Machines/sheetifier.rsi
    layers:
    - state: base_machine
      map: ["enum.LatheVisualLayers.IsRunning"]
    - state: buttons_on
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
  - type: Lathe
    idleState: base_machine
    runningState: base_machine_processing
