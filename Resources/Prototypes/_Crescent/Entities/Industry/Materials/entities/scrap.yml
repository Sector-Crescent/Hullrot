# YAMLFIX: You can't give material stacks static prices without messing stuff up and failing tests. The material values may need to be recalibrated.
- type: entity
  parent: OreBase
  id: SteelScrapOre
  name: low-grade metal shards
  description: Scraps of steel and fused power cables blasted off larger structures.
  suffix: Full
  components:
  - type: Stack
    stackType: SteelScrapOre
  - type: Tag
    tags:
    - RawMaterial
  - type: Currency
    price:
      ScrapSAW: 0.2
  - type: Sprite
    sprite: _Crescent/Objects/Materials/ore.rsi
    state: icon-scrap
  - type: Material
  - type: PhysicalComposition
    materialComposition:
      ScrapLowGrade: 100

- type: entity
